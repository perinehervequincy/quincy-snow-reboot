<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Quincy Snow Reboot V2</title><style>*{box-sizing:border-box}body{margin:0;background:#171936;color:white;font:bold 16px system-ui;overflow:hidden;touch-action:none}canvas{display:block;width:100vw;height:100dvh}#sound{position:absolute;right:12px;top:48px;z-index:2;font-size:14px;padding:8px}#hud{position:absolute;top:12px;left:12px;right:12px;text-shadow:2px 2px #222;pointer-events:none}#panel{position:absolute;inset:0;display:grid;place-content:center;text-align:center;background:#10152bbd;padding:24px}button{background:#5135a5;color:white;border:2px solid #b8cfff;border-radius:14px;padding:14px;font:bold 18px system-ui;touch-action:none}#touch{position:absolute;bottom:12px;left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none}#touch button{pointer-events:auto;min-width:48px;min-height:48px;background:#172554aa}#touch div{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.hide{display:none!important}@media(pointer:fine){#touch{display:none}}</style></head><body><div id="hud"></div><button id="sound" aria-label="Activer ou couper le son">🔊 Son</button><div id="touch"><div><span></span><button data-k="ArrowUp">↑</button><span></span><button data-k="ArrowLeft">←</button><button data-k="ArrowDown">↓</button><button data-k="ArrowRight">→</button></div><div><button data-k="a">A</button><button data-k="z">Z</button></div></div><div id="panel"><h1>QUINCY SNOW REBOOT</h1><p>V2 · Snow Bot</p><p id="msg">Glisse dans le vide et récupère les tablettes !<br>Flèches : direction et vitesse · A : saut · Z : turbo</p><button id="start">Jouer</button></div><script type="module">

import * as T from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const scene=new T.Scene();scene.background=new T.Color(0x30265c);scene.fog=new T.FogExp2(0x30265c,.009);const camera=new T.PerspectiveCamera(68,innerWidth/innerHeight,.1,600);const renderer=new T.WebGLRenderer({antialias:false});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);document.body.prepend(renderer.domElement);scene.add(new T.HemisphereLight(0xddeeff,0x544478,2));const sun=new T.DirectionalLight(0xffffff,2);sun.position.set(10,30,10);scene.add(sun);
const mat=c=>new T.MeshStandardMaterial({color:c,flatShading:true});const ice=mat(0xf5faff),edge=mat(0x5299d4),purple=mat(0x793ad1),skin=mat(0xffcf9c),dark=mat(0x20253e),gold=mat(0xffc83d);const L=1600,W=5;function center(s){return new T.Vector3(22*Math.sin(s/65)+10*Math.sin(s/24),-s*.19+2*Math.sin(s/17),-s)}function pos(s,x=0,y=0){const p=center(s),d=center(s+.1).sub(p);const n=new T.Vector3(-d.z,0,d.x).normalize();return p.addScaledVector(n,x).add(new T.Vector3(0,y,0))}function strip(a,b,m){let v=[],idx=[];for(let s=0;s<=L;s+=2){for(const x of [a,b]){const p=pos(s,x);v.push(p.x,p.y,p.z)}if(s){let i=v.length/3-4;idx.push(i,i+2,i+1,i+1,i+2,i+3)}}let g=new T.BufferGeometry();g.setAttribute('position',new T.Float32BufferAttribute(v,3));g.setIndex(idx);const uv=[];for(let i=0;i<v.length/3;i++)uv.push(i%2*3,Math.floor(i/2)*.35);g.setAttribute("uv",new T.Float32BufferAttribute(uv,2));g.computeVertexNormals();m.side=T.DoubleSide;scene.add(new T.Mesh(g,m))}// Procedural snow texture: no external artwork.
const snowCanvas=document.createElement('canvas');snowCanvas.width=snowCanvas.height=128;const sc=snowCanvas.getContext('2d');sc.fillStyle='#f4f9ff';sc.fillRect(0,0,128,128);for(let i=0;i<1500;i++){sc.fillStyle=i%3?'#e4eff9':'#ffffff';sc.fillRect(Math.random()*128,Math.random()*128,2+Math.random()*4,2+Math.random()*3)}const snowTex=new T.CanvasTexture(snowCanvas);snowTex.wrapS=snowTex.wrapT=T.RepeatWrapping;snowTex.magFilter=T.NearestFilter;snowTex.colorSpace=T.SRGBColorSpace;ice.map=snowTex;
strip(-W,W,ice);strip(-W,-W+.3,edge);strip(W-.3,W,edge);
function mesh(g,m,p,parent=scene){const o=new T.Mesh(g,m);o.position.copy(p);parent.add(o);return o}const player=new T.Group();scene.add(player);// Quincy robot: original low-poly mascot.
const white=mat(0xe9f3ff),cyan=new T.MeshStandardMaterial({color:0x42e8ff,emissive:0x149dbb,emissiveIntensity:1.2,flatShading:true});
const part=(g,m,x,y,z,parent=player)=>mesh(g,m,new T.Vector3(x,y,z),parent);
part(new T.CylinderGeometry(.48,.58,.8,8),purple,0,.85,0);part(new T.SphereGeometry(.65,12,8),white,0,1.65,0);part(new T.BoxGeometry(.88,.42,.18),dark,0,1.68,-.53);for(const x of [-.22,.22])part(new T.SphereGeometry(.115,8,6),cyan,x,1.72,-.64);part(new T.BoxGeometry(.25,.045,.05),cyan,0,1.53,-.64);part(new T.CylinderGeometry(.045,.045,.35,6),dark,0,2.35,0);part(new T.SphereGeometry(.13,8,6),cyan,0,2.55,0);part(new T.BoxGeometry(.45,.34,.24),dark,0,.92,.49);part(new T.BoxGeometry(.3,.12,.03),cyan,0,.94,.63);
const arms=[];for(const x of [-1,1]){const arm=new T.Group();arm.position.set(x*.61,1.08,0);player.add(arm);part(new T.SphereGeometry(.18,8,6),purple,0,0,0,arm);part(new T.CylinderGeometry(.13,.16,.42,8),white,0,-.25,0,arm);part(new T.SphereGeometry(.19,8,6),dark,0,-.49,0,arm);arms.push(arm);part(new T.BoxGeometry(.42,.28,.85),purple,x*.32,.16,0);part(new T.BoxGeometry(.46,.09,.91),cyan,x*.32,.055,0)}
// Snow banks and crystalline underside along the floating track.
for(let q=0;q<L;q+=5){for(const side of [-1,1]){const o=mesh(new T.DodecahedronGeometry(.6,0),white,pos(q,side*(W-.25),.06));o.scale.set(.65,.36,1.7);o.rotation.y=q*.71}}
// Original synthesized arcade soundtrack and sound effects.
let audio,master,musicTimer,slide,slideGain,muted=false,beat=0;
function tone(f,d=.12,type='triangle',vol=.08,delay=0,end=f){if(!audio||muted)return;const t=audio.currentTime+delay,o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,end),t+d);g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(vol,t+.012);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(master);o.start(t);o.stop(t+d+.02)}
const hz=n=>440*2**((n-69)/12);const melody=[72,76,79,76,74,77,81,77,76,79,84,79,77,76,74,71,72,79,76,84,81,77,74,77,76,79,83,79,74,77,71,74];const bass=[48,50,52,55,48,50,52,55];
function music(){if(!running||muted)return;const i=beat++%32;tone(hz(melody[i]),.15,'triangle',.045);if(i%2===0)tone(hz(bass[Math.floor(i/4)]),.19,'triangle',.055);if(i%4===2)tone(130,.055,'sine',.035,0,45)}
function startAudio(){try{if(!audio){audio=new (window.AudioContext||window.webkitAudioContext)();master=audio.createGain();master.gain.value=.65;master.connect(audio.destination);const buf=audio.createBuffer(1,audio.sampleRate*2,audio.sampleRate);const data=buf.getChannelData(0);for(let i=0;i<data.length;i++)data[i]=Math.random()*2-1;slide=audio.createBufferSource();slide.buffer=buf;slide.loop=true;const filter=audio.createBiquadFilter();filter.type='lowpass';filter.frequency.value=650;slideGain=audio.createGain();slideGain.gain.value=0;slide.connect(filter).connect(slideGain).connect(master);slide.start();musicTimer=setInterval(music,180)}audio.resume()}catch(e){console.warn('Audio indisponible',e)}}
document.querySelector('#sound').onclick=()=>{muted=!muted;document.querySelector('#sound').textContent=muted?'🔇 Muet':'🔊 Son';if(master)master.gain.value=muted?0:.65};
const tablets=[];for(let s=25;s<L-20;s+=17){const x=3.2*Math.sin(s*.17),o=new T.Group();o.position.copy(pos(s,x,1.1));scene.add(o);mesh(new T.BoxGeometry(.85,1.15,.18),gold,new T.Vector3(),o);mesh(new T.BoxGeometry(.67,.91,.2),mat(0x28c9ff),new T.Vector3(),o);tablets.push({s,x,o,got:false})}const rocks=[];for(let s=100;s<L-30;s+=71){const x=3*Math.cos(s);const o=mesh(new T.DodecahedronGeometry(.85,0),mat(0x7791b8),pos(s,x,.65));rocks.push({s,x,o,hit:false})}const stars=[];for(let i=0;i<1800;i++)stars.push((Math.random()-.5)*500,Math.random()*300-180,-Math.random()*1900);const sg=new T.BufferGeometry();sg.setAttribute('position',new T.Float32BufferAttribute(stars,3));scene.add(new T.Points(sg,new T.PointsMaterial({color:0xddeeff,size:.65})));
const keys=new Set();const key=e=>e.key.length===1?e.key.toLowerCase():e.key;addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','a','z'].includes(key(e))){e.preventDefault();keys.add(key(e))}});addEventListener('keyup',e=>keys.delete(key(e)));addEventListener('blur',()=>keys.clear());for(const b of document.querySelectorAll('[data-k]')){b.onpointerdown=e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys.add(b.dataset.k)};b.onpointerup=b.onpointercancel=b.onlostpointercapture=()=>keys.delete(b.dataset.k)}
let s=0,x=0,h=0,vy=0,speed=15,lives=3,score=0,time=0,running=false,jumpHeld=false;const panel=document.querySelector('#panel'),hud=document.querySelector('#hud'),msg=document.querySelector('#msg');function reset(){startAudio();beat=0;jumpHeld=false;s=0;x=0;h=vy=0;speed=15;lives=3;score=time=0;for(const t of tablets){t.got=false;t.o.visible=true}for(const r of rocks)r.hit=false;keys.clear();running=true;panel.classList.add('hide')}document.querySelector('#start').onclick=reset;function finish(won){running=false;panel.classList.remove('hide');msg.textContent=(won?'Piste terminée !':'Partie terminée !')+' Score : '+score+' · Temps : '+Math.floor(time)+' s';document.querySelector('#start').textContent='Rejouer'}function damage(){tone(160,.35,"sawtooth",.09,0,45);lives--;if(!lives){finish(false);return}x=0;h=vy=0;speed=12;s=Math.min(L,s+4)}let turboHeld=false;let last=performance.now();function loop(now){requestAnimationFrame(loop);let dt=Math.min(.04,(now-last)/1000);last=now;if(running){time+=dt;let target=keys.has('z')?43:keys.has('ArrowDown')?9:keys.has('ArrowUp')?32:22+Math.min(8,s/200);speed+=(target-speed)*dt*2;s+=speed*dt;x+=((keys.has('ArrowRight')?1:0)-(keys.has('ArrowLeft')?1:0))*dt*8;let j=keys.has('a');if(j&&!jumpHeld&&h===0){vy=8;tone(330,.22,"triangle",.09,0,720)}jumpHeld=j;vy-=20*dt;h=Math.max(0,h+vy*dt);if(h===0)vy=0;if(Math.abs(x)>W+.2)damage();for(const t of tablets){if(!t.got&&Math.abs(s-t.s)<1.8&&Math.abs(x-t.x)<1.1&&h<2){t.got=true;t.o.visible=false;score+=100;tone(880,.12,"sine",.13);tone(1320,.16,"triangle",.09,.08)}t.o.rotation.y=now*.003}for(const r of rocks)if(!r.hit&&Math.abs(s-r.s)<1.5&&Math.abs(x-r.x)<1.3&&h<1.2){r.hit=true;damage()}if(s>=L-3&&running)finish(true)}if(slideGain)slideGain.gain.setTargetAtTime(running&&!muted&&h<.1?speed/43*.045:0,audio.currentTime,.08);if(running&&keys.has("z")&&!turboHeld)tone(180,.35,"sawtooth",.06,0,480);turboHeld=running&&keys.has("z");arms.forEach((a,i)=>a.rotation.z=(i?1:-1)*(.25+.15*Math.sin(now*.009)));player.position.copy(pos(s,x,h));player.rotation.y=-Math.atan2(center(s+.1).x-center(s).x,.1);const cp=pos(Math.max(-12,s-12),x*.45,7);camera.position.lerp(cp,.15);camera.lookAt(pos(s+13,x*.35,1));hud.textContent=`▣ ${score/100}   |   Score ${score}   |   ♥ ${lives}   |   ${Math.floor(time)} s   |   ${Math.min(100,Math.floor(s/L*100))}%`;renderer.render(scene,camera)}requestAnimationFrame(loop);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
